# push するたびに ビルドして GitHub Pages に公開する。
# 手元で npm run build する必要はない。GitHub側で作ってくれる。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 手動でも動かせるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1つずつ。走っている途中のものは 止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: ルールのテスト
        run: npm test          # 落ちたら 公開しない

      - name: ビルド
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
