<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>グリフォン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="screen">

  <div id="rotate-tip">📱 たて画面の方が 遊びやすいよ<button id="tip-close">とじる</button></div>

  <!-- メニュー（右上） -->
  <button id="menu-btn" type="button" aria-label="メニュー">≡</button>

  <!-- 敵リーダー -->
  <div class="win leader-row enemy-side">
    <div class="leader-portrait" id="enemy-leader">👹</div>
    <div class="leader-info">
      <div class="leader-name">まおう</div>
      <div class="stat-bar">
        <span class="badge hp">HP <span id="enemy-hp">20</span></span>
        <span class="badge mp">MP <span id="enemy-mp">0</span>/<span id="enemy-maxmp">0</span></span>
        <span class="badge deck">やまふだ <span id="enemy-deck">40</span></span>
        <span class="badge guard" id="enemy-guard" hidden>🛡 まもられている</span>
      </div>
    </div>
    <div class="enemy-hand" id="enemy-hand"></div>
  </div>

  <!-- 盤面 -->
  <div class="board">
    <div class="row" id="enemy-back"><span class="row-tag">こうれつ</span></div>
    <div class="row" id="enemy-front"><span class="row-tag">ぜんれつ</span></div>

    <div class="center-bar">
      <div class="win" id="log"></div>
      <button class="btn" id="turn-btn">ターンおわり</button>
    </div>

    <div class="row" id="player-front"><span class="row-tag">ぜんれつ</span></div>
    <div class="row" id="player-back"><span class="row-tag">こうれつ</span></div>
  </div>

  <!-- 自リーダー -->
  <div class="win leader-row player-side">
    <div class="leader-portrait" id="player-leader">🗡️</div>
    <div class="leader-info">
      <div class="leader-name">ゆうしゃ</div>
      <div class="stat-bar">
        <span class="badge hp">HP <span id="player-hp">20</span></span>
        <span class="badge mp">MP <span id="player-mp">0</span>/<span id="player-maxmp">0</span></span>
        <div class="mp-pips" id="mp-pips"></div>
        <span class="badge deck">やまふだ <span id="player-deck">40</span></span>
        <span class="badge guard" id="player-guard" hidden>🛡 まもられている</span>
      </div>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <div class="hand-area" id="player-hand"></div>

  <!-- ボタンは 右上の ≡ メニューに まとめた。
       中身は JS が モーダルに つくる（なまえ / マニュアル / さいしょから / こうさん） -->
</div>

<div id="fx"></div>

<!-- カードを 大きく見るところ（長おし / 右クリック） -->
<div id="zoom"><div class="zoom-card" id="zoom-card"></div></div>

<div id="overlay">
  <div class="modal">
    <h1 id="modal-title">グリフォン</h1>
    <div class="sub" id="modal-sub">GRID FORMATION</div>
    <div class="rules" id="modal-rules"></div>
    <button class="btn" id="modal-btn">たたかう</button>
    <div class="modal-note" id="modal-note"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
